<style>
:root {
  --bg: #0c1220;
  --surface: #131e30;
  --surface-2: #1a2840;
  --border: #243350;
  --border-2: #304567;
  --text: #dde4ef;
  --muted: #6b7f9a;
  --dim: #3d5070;
  --accent: #3d82c4;
  --accent-dim: #1a3a5c;
  --ok: #1a9e5a;
  --ok-bg: #0a2018;
  --ok-text: #4cd98a;
  --warn: #b87a10;
  --warn-bg: #221500;
  --warn-text: #f5b93e;
  --danger: #b53028;
  --danger-bg: #220a08;
  --danger-text: #ff7066;
  --radius: 4px;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 13px; line-height: 1.5; min-height: 100vh; }

/* HEADER */
.hdr { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 100; }
.hdr-left { display: flex; align-items: center; gap: 10px; }
.hdr-title { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
.hdr-title em { font-style: normal; color: var(--accent); }
.hdr-right { display: flex; align-items: center; gap: 14px; }
.mode-badge { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 7px; border-radius: 3px; border: 1px solid; }
.mode-demo { color: var(--warn-text); border-color: var(--warn); background: var(--warn-bg); }
.mode-live { color: var(--ok-text); border-color: var(--ok); background: var(--ok-bg); }
.last-upd { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.refresh-btn { font-size: 11px; color: var(--accent); background: none; border: 1px solid var(--accent-dim); border-radius: var(--radius); padding: 4px 10px; cursor: pointer; font-family: var(--font); }
.refresh-btn:hover { background: var(--accent-dim); }
.refresh-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ALERTS */
#alerts { padding: 0 20px; }
.alert-bar { display: flex; align-items: flex-start; gap: 10px; padding: 9px 14px; border-left: 3px solid; margin-top: 10px; border-radius: 0 var(--radius) var(--radius) 0; }
.alert-bar.danger { border-color: var(--danger); background: var(--danger-bg); color: var(--danger-text); }
.alert-bar.warn { border-color: var(--warn); background: var(--warn-bg); color: var(--warn-text); }
.alert-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-top: 5px; flex-shrink: 0; }
.alert-text { font-size: 12px; line-height: 1.4; }

/* LAYOUT */
.main { display: grid; grid-template-columns: 1fr 1fr; }
.panel { padding: 16px 20px; border-right: 1px solid var(--border); }
.panel:last-child { border-right: none; }

/* PANEL HEADER */
.panel-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.panel-title { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.panel-sub { font-size: 11px; color: var(--dim); }

/* SECTION LABEL */
.slabel { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; margin-top: 16px; }

/* STAT CARDS */
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; }
.stat-lbl { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.stat-val { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1; }
.stat-sub { font-size: 10px; color: var(--muted); margin-top: 3px; }
.c-ok { color: var(--ok-text); }
.c-warn { color: var(--warn-text); }
.c-danger { color: var(--danger-text); }
.c-muted { color: var(--muted); }
.c-accent { color: var(--accent); }

/* AGENCY TABLE */
.agency-hdr { display: grid; grid-template-columns: 80px 1fr 1fr 1fr 40px 40px; gap: 8px; padding: 4px 10px; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
.agency-row { display: grid; grid-template-columns: 80px 1fr 1fr 1fr 40px 40px; gap: 8px; padding: 8px 10px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); font-size: 12px; font-variant-numeric: tabular-nums; margin-bottom: 4px; }
.acol { text-align: right; }
.acol-name { font-weight: 600; }

/* KPI BARS */
.kpi-list { display: flex; flex-direction: column; gap: 10px; }
.kpi-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
.kpi-lbl { font-size: 12px; color: var(--text); margin-bottom: 4px; }
.kpi-track { height: 5px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.kpi-fill { height: 100%; border-radius: 2px; background: var(--accent); transition: width 0.4s; }
.kpi-fill.ok { background: var(--ok); }
.kpi-fill.warn { background: var(--warn); }
.kpi-fill.danger { background: var(--danger); }
.kpi-nums { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }

/* TABLE */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
thead th { background: var(--surface-2); padding: 7px 10px; text-align: left; font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); white-space: nowrap; }
tbody tr { border-bottom: 1px solid var(--border); }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--surface-2); }
td { padding: 8px 10px; color: var(--text); vertical-align: middle; }
tr.rdanger td:first-child { border-left: 2px solid var(--danger); padding-left: 8px; }
tr.rwarn td:first-child { border-left: 2px solid var(--warn); padding-left: 8px; }

/* STAGE PILLS */
.stage { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: 0.05em; padding: 2px 7px; border-radius: 3px; border: 1px solid; white-space: nowrap; }
.s-lmr { color: #7bb8f0; border-color: #264a6e; background: #0e1e30; }
.s-audit { color: #a78bfa; border-color: #4c2f8f; background: #140e28; }
.s-booked { color: var(--warn-text); border-color: var(--warn); background: var(--warn-bg); }
.s-done { color: #5bccb0; border-color: #1d6554; background: #091e18; }
.s-qual { color: var(--ok-text); border-color: var(--ok); background: var(--ok-bg); }
.s-poc { color: #93c5fd; border-color: #2563a0; background: #0c1e38; }
.s-closed { color: var(--muted); border-color: var(--border); background: var(--surface-2); }

/* Q2 BAR */
.q2-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; }
.q2-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.q2-big { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.q2-track { height: 7px; background: var(--bg); border-radius: 3px; overflow: hidden; }
.q2-fill { height: 100%; border-radius: 3px; transition: width 0.4s; }
.q2-fill.ok { background: var(--ok); }
.q2-fill.warn { background: var(--warn); }
.q2-fill.danger { background: var(--danger); }

/* TODOS */
.todo-section { display: flex; flex-direction: column; gap: 14px; }
.todo-grp-lbl { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.todo-cnt { font-size: 9px; background: var(--surface); color: var(--muted); padding: 1px 5px; border-radius: 2px; border: 1px solid var(--border); }
.todo-item { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); }
.todo-item:last-child { border-bottom: none; }
.todo-item input[type="checkbox"] { margin-top: 2px; flex-shrink: 0; width: 13px; height: 13px; cursor: pointer; accent-color: var(--accent); }
.todo-txt { font-size: 12px; color: var(--text); line-height: 1.4; flex: 1; cursor: pointer; }
.todo-item.done .todo-txt { color: var(--dim); text-decoration: line-through; }
.todo-meta { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.pri-high { font-size: 9px; font-weight: 700; color: var(--danger-text); }
.due { font-size: 10px; color: var(--muted); }
.due.overdue { color: var(--danger-text); }
.owner-tag { font-size: 10px; color: var(--dim); }

/* FUNNEL */
.funnel { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.funnel-row { display: grid; grid-template-columns: 130px 1fr 52px 64px; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--surface); }
.funnel-row:last-child { border-bottom: none; }
.funnel-row:hover { background: var(--surface-2); }
.funnel-stage-name { font-size: 11px; font-weight: 500; color: var(--text); white-space: nowrap; }
.funnel-bar-wrap { position: relative; height: 18px; background: var(--bg); border-radius: 2px; overflow: hidden; }
.funnel-bar-fill { position: absolute; left: 0; top: 0; height: 100%; border-radius: 2px; transition: width 0.5s ease; }
.funnel-bar-label { position: absolute; left: 7px; top: 0; height: 100%; display: flex; align-items: center; font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.85); pointer-events: none; white-space: nowrap; }
.funnel-count { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; text-align: right; }
.funnel-conv { font-size: 10px; text-align: right; font-variant-numeric: tabular-nums; }
.funnel-conv-up { color: var(--ok-text); }
.funnel-conv-down { color: var(--warn-text); }
.funnel-conv-na { color: var(--dim); }
.funnel-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.funnel-stat { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; text-align: center; }
.funnel-stat-val { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.funnel-stat-lbl { font-size: 10px; color: var(--muted); margin-top: 2px; letter-spacing: 0.05em; }

/* DIVIDER */
.divider { height: 1px; background: var(--border); margin: 16px 0; }

/* RESOURCES */
.resources { border-top: 1px solid var(--border); padding: 14px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.res-title { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.res-links { display: flex; flex-direction: column; gap: 5px; }
.res-a { font-size: 12px; color: var(--accent); text-decoration: none; }
.res-a:hover { color: var(--text); }
.res-a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
.res-note { font-size: 11px; color: var(--muted); }

@media (max-width: 900px) {
  .main { grid-template-columns: 1fr; }
  .panel { border-right: none; border-bottom: 1px solid var(--border); }
  .resources { grid-template-columns: 1fr; }
}
</style>
</head>

// ── TODO STORE ───────────────────────────────────────────────
const TS = {
  KEY: 'gw-todos-v1',
  DATE: 'gw-todos-date',
  get() {
    const today = new Date().toDateString();
    let ch = {};
    try { ch = JSON.parse(localStorage.getItem(this.KEY) || '{}'); } catch(e) {}
    if (localStorage.getItem(this.DATE) !== today) {
      const kept = {};
      Object.keys(ch).forEach(id => { if (id.includes('-o-')) kept[id] = true; });
      ch = kept;
      localStorage.setItem(this.DATE, today);
      localStorage.setItem(this.KEY, JSON.stringify(ch));
    }
    return ch;
  },
  set(id, val) {
    const ch = this.get();
    if (val) ch[id] = true; else delete ch[id];
    localStorage.setItem(this.KEY, JSON.stringify(ch));
  },
};

// ── CSV PARSER ───────────────────────────────────────────────
function parseCSV(txt) {
  const lines = txt.trim().split('\n');
  if (!lines.length) return [];
  const heads = splitLine(lines[0]).map(h => h.toLowerCase().trim().replace(/\s+/g,'_'));
  return lines.slice(1).filter(l=>l.trim()).map(line => {
    const vals = splitLine(line);
    const o = {};
    heads.forEach((h,i) => { o[h] = (vals[i]||'').trim(); });
    return o;
  });
}
function splitLine(line) {
  const r=[]; let cur='', q=false;
  for (let c of line) {
    if (c==='"') q=!q;
    else if (c===',' && !q) { r.push(cur); cur=''; }
    else cur+=c;
  }
  r.push(cur); return r;
}

// ── DATA LOAD ────────────────────────────────────────────────
async function loadData() {
  if (!CFG.csvLeads && !CFG.csvWeekly) { S.isDemo=true; S.lastUpd=new Date(); return; }
  async function get(url) {
    if (!url) return null;
    try { const r=await fetch(url); return r.ok ? parseCSV(await r.text()) : null; } catch { return null; }
  }
  const [leads,weekly,goalsR,todosR] = await Promise.all([get(CFG.csvLeads),get(CFG.csvWeekly),get(CFG.csvGoals),get(CFG.csvTodos)]);
  if (leads) S.leads = leads.map(r=>({n:r.lead_name||'',co:r.company||'',stage:r.stage||'',src:r.source||'',lad:r.last_action_date||'',mtg:r.meeting_date||'',next:r.next_action||'',i:r.intro_sent||'N',fu1:r.fu1_sent||'N',fu2:r.fu2_sent||'N',sql:r.sql||'N'}));
  if (weekly) S.weekly = weekly.map(r=>({we:r.week_ending,ed:+r.newsletter_editions||0,lmr:+r.lead_magnet_replies||0,cep:+r.ce_contacts_provided||0,ces:+r.ce_emails_sent||0,cor:+r.ce_open_rate||0,cee:+r.ce_engaged||0,nmb:+r.newsletter_mb||0,nmd:+r.newsletter_md||0,cmb:+r.ce_mb||0,cmd:+r.ce_md||0}));
  if (goalsR) { const g={}; goalsR.forEach(r=>{ g[(r.channel||'')+'_'+(r.metric||'').toLowerCase().replace(/\s/g,'_')]=+r.target||0; }); S.goals={...DEMO_GOALS,...g}; }
  if (todosR) S.todos = todosR.map((r,i)=>({id:r.id||`t${i}`,t:r.task||'',ch:r.channel||'',tp:r.type||'One-Time',ow:r.owner||'Salama',hi:(r.priority||'').toLowerCase()==='high',due:r.due_date||''}));
  S.isDemo=false; S.lastUpd=new Date();
}

// ── FLAGS ────────────────────────────────────────────────────
function flags() {
  const f=[], w=S.weekly[0]||{}, now=new Date(), dow=now.getDay();
  const g=S.goals;

  // CE pace
  const totalCE = S.weekly.reduce((s,wk)=>s+(wk.cep||0),0);
  const wkTarget = Math.round(g.ce_total/20);
  if ((w.cep||0) < wkTarget*0.6) f.push({s:'danger',t:`Cold email: ${w.cep||0} contacts this week — below 60% of weekly pace (target ~${wkTarget.toLocaleString()}/wk)`});

  // Newsletter editions
  if (dow>=3 && (w.ed||0)<1) f.push({s:'danger',t:`Newsletter: No edition published this week (Wednesday or later)`});

  // Unanswered lead magnet replies
  S.leads.forEach(l=>{
    if (l.stage==='Lead Magnet Reply' && l.i!=='Y') {
      const d=daysSince(l.lad);
      if (d>=2) f.push({s:'danger',t:`${l.n}: Lead magnet reply unanswered for ${d} day${d>1?'s':''}`});
    }
  });

  // Meeting booked, no intro sent
  S.leads.forEach(l=>{
    if (l.stage==='Meeting Booked' && l.i!=='Y') {
      const hrs=Math.floor((now-new Date(l.lad))/3600000);
      if (hrs>24) f.push({s:'danger',t:`${l.n}: Meeting booked ${Math.floor(hrs/24)}d ago — no intro nurture sent`});
    }
    // FU1 due
    if (l.stage==='Meeting Booked' && l.mtg && l.fu1!=='Y') {
      const du=daysUntil(l.mtg);
      if (du>=0 && du<=3) f.push({s:'warn',t:`${l.n}: Meeting in ${du}d — FU1 nurture not sent yet`});
    }
  });

  return f;
}

// ── HELPERS ──────────────────────────────────────────────────
function daysSince(d) { if(!d)return 999; const v=new Date(d); return isNaN(v)?999:Math.floor((new Date()-v)/86400000); }
function daysUntil(d) { if(!d)return 999; const v=new Date(d); return isNaN(v)?999:Math.ceil((v-new Date())/86400000); }
function pct(a,b) { return b?Math.min(100,Math.round(a/b*100)):0; }
function cls(p) { return p>=90?'ok':p>=60?'warn':'danger'; }
function fmtD(d) { if(!d)return '—'; try{return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short'});}catch{return d;} }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function stageCls(s) {
  const r=stageRank(s);
  if(r===0) return 's-lmr';
  if(r===1) return 's-audit';
  if(r===2) return 's-booked';
  if(r===3) return 's-done';
  if(r===4) return 's-poc';
  if(r===5) return 's-qual';
  return 's-closed'; // lost / -1
}
function stageShort(s) {
  const l=s.toLowerCase();
  if(l==='new lead')            return 'New Lead';
  if(l.includes('opportunity')) return 'In Progress';
  if(l.includes('nurture'))     return 'Nurture';
  if(l==='meeting done')        return 'Mtg Done';
  if(l.includes('moved to'))    return 'Closed';
  if(l.includes('converted'))   return 'Closed';
  if(l==='lead magnet reply')   return 'LM Reply';
  if(l==='poc/proposal')        return 'Proposal';
  if(l.includes('proposal'))    return 'Proposal';
  if(l==='audit sent')          return 'Audit Sent';
  if(l==='meeting booked')      return 'Booked';
  return s;
}

// ── FUNNEL ───────────────────────────────────────────────────
// Handles both CRM Lead_Status names (New Lead, Opportunity - Working, Meeting Done…)
// and custom stage names (Lead Magnet Reply, Audit Sent, Meeting Booked…)
function stageRank(s) {
  const l = s.toLowerCase();
  if (l === 'new lead' || l.includes('magnet'))     return 0;
  if (l.includes('opportunity') || l.includes('nurture') || l.includes('audit')) return 1;
  if (l.includes('booked'))                         return 2;
  if (l === 'meeting done' || (l.includes('meeting') && l.includes('done'))) return 3;
  if (l.includes('qualif') || l.includes('poc') || l.includes('proposal')) return 4;
  if (l.includes('moved to deals') || l.includes('converted') || l.includes('closed') || l.includes('won')) return 5;
  if (l.includes('dead') || l.includes('not qualified') || l.includes('do not pursue') || l.includes('lost')) return -1;
  return 0;
}

function renderFunnel() {
  const leads = S.leads.filter(l => stageRank(l.stage) >= 0); // exclude Lost for now
  const total = leads.length;
  if (!total) return '<div class="c-muted" style="font-size:12px;padding:8px 0">No leads yet.</div>';

  const STAGES = [
    { label: 'Total Leads',          rank: 0, color: '#3d82c4' },
    { label: 'In Progress',          rank: 1, color: '#7c6be8' },
    { label: 'Meeting Booked',       rank: 2, color: '#b87a10' },
    { label: 'Meeting Done',         rank: 3, color: '#1d9e8a' },
    { label: 'Proposal / POC',       rank: 4, color: '#1a9e5a' },
    { label: 'Closed (Moved to Deals)', rank: 5, color: '#4cd98a' },
  ];

  // Cumulative counts: leads who reached at least this rank
  const counts = STAGES.map(st =>
    st.rank === 0 ? total : leads.filter(l => stageRank(l.stage) >= st.rank).length
  );

  // Currently sitting at each exact stage (not yet advanced)
  const atStage = STAGES.map(st =>
    leads.filter(l => stageRank(l.stage) === st.rank).length
  );

  let rows = '';
  STAGES.forEach((st, i) => {
    const n     = counts[i];
    const prev  = i === 0 ? null : counts[i - 1];
    const barW  = total ? Math.round((n / total) * 100) : 0;
    const conv  = (prev !== null && prev > 0) ? Math.round((n / prev) * 100) : null;
    const convCls = conv === null ? 'funnel-conv-na' : conv >= 50 ? 'funnel-conv-up' : 'funnel-conv-down';
    const convStr = conv === null ? '—' : `${conv}% from prev`;
    const stuck   = atStage[i];

    rows += `<div class="funnel-row">
      <div class="funnel-stage-name">${esc(st.label)}</div>
      <div class="funnel-bar-wrap">
        <div class="funnel-bar-fill" style="width:${barW}%;background:${st.color}22;border-right:2px solid ${st.color}"></div>
        <div class="funnel-bar-label" style="color:${st.color}">${n} lead${n!==1?'s':''} · ${barW}%${stuck > 0 && i < 5 ? ` · <span style="opacity:.7">${stuck} here now</span>` : ''}</div>
      </div>
      <div class="funnel-count" style="color:${st.color}">${n}</div>
      <div class="funnel-conv ${convCls}">${convStr}</div>
    </div>`;
  });

  // Summary stats
  const mbCount  = counts[2]; // reached meeting booked
  const mdCount  = counts[3]; // meeting done
  const pocCount = counts[4]; // qualified/poc
  const closedN  = counts[5];
  const lostN    = leads.filter(l => stageRank(l.stage) === -1).length;
  const leadToMtg  = total ? Math.round((mdCount / total) * 100) : 0;
  const mtgToProp  = mdCount ? Math.round((pocCount / mdCount) * 100) : 0;
  const overallCvr = total ? Math.round((closedN / total) * 100) : 0;

  const summary = `
    <div class="funnel-summary">
      <div class="funnel-stat">
        <div class="funnel-stat-val c-accent">${leadToMtg}%</div>
        <div class="funnel-stat-lbl">Lead → Meeting</div>
      </div>
      <div class="funnel-stat">
        <div class="funnel-stat-val c-ok">${mtgToProp}%</div>
        <div class="funnel-stat-lbl">Meeting → Proposal</div>
      </div>
      <div class="funnel-stat">
        <div class="funnel-stat-val ${closedN > 0 ? 'c-ok' : 'c-muted'}">${overallCvr}%</div>
        <div class="funnel-stat-lbl">Overall Closed</div>
      </div>
    </div>`;

  return `<div class="funnel">${rows}</div>${summary}`;
}

// ── TOGGLE TODO ──────────────────────────────────────────────
function toggle(id, val) {
  TS.set(id, val);
  const w=document.getElementById('tw-'+id);
  if(w) w.classList.toggle('done', val);
}

// ── REFRESH ──────────────────────────────────────────────────
async function doRefresh() {
  const b=document.querySelector('.refresh-btn');
  if(b) b.textContent='↻ Refreshing…';
  await loadData();
  render();
  if(b) b.textContent='↻ Refresh';
}

// ── INIT ─────────────────────────────────────────────────────
(async()=>{
  await loadData();
  render();
  setInterval(doRefresh, CFG.refresh);
})();
